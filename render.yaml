databases:
  - name: quicknote-db
    plan: free
    databaseName: quicknote
    ipAllowList: []   # só o serviço web (rede interna do Render) acessa o banco

services:
  - type: web
    name: quicknote
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: quicknote-db
          property: connectionString
