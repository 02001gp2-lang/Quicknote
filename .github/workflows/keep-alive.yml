name: Keep alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "Defina a variável APP_URL"; exit 1; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$APP_URL/healthz"
